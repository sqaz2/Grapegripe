<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#090611" />
    <meta
      name="description"
      content="Travel the living Gripevine, battle corrupted complaints, and unleash the Grape Gripe."
    />
    <title>Grape Gripe — Journey Through the Gripevine</title>
    <link rel="preload" href="./assets/root-cellar.webp" as="image" />
    <link rel="preload" href="./assets/grape-fighter.webp" as="image" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main id="game-shell" aria-label="Grape Gripe action journey">
      <canvas
        id="world"
        aria-label="A top-down journey through four vineyard regions. Move in eight directions with the left control. Attack, dash, and unleash the Grape Gripe with the buttons on the right."
      ></canvas>

      <div id="loading-screen" class="loading-screen" aria-live="polite">
        <div class="loading-seed" aria-hidden="true"><i></i><i></i><i></i></div>
        <span class="sr-only">Growing the Gripevine</span>
      </div>

      <section id="start-screen" class="start-screen" hidden>
        <div class="brand-lockup" aria-hidden="true">
          <span>GRAPE</span><i></i><span>GRIPE</span>
        </div>
        <img
          class="start-fighter"
          src="./assets/grape-fighter.webp"
          alt=""
          width="606"
          height="620"
        />
        <button id="start-button" class="start-button" type="button" aria-label="Begin the journey">
          <svg viewBox="0 0 100 100" aria-hidden="true">
            <path d="M38 25 76 50 38 75Z" />
          </svg>
        </button>
        <div class="start-waves" aria-hidden="true">
          <i></i><i></i><i></i><i class="boss-dot"></i>
        </div>
      </section>

      <section id="hud" class="hud" aria-label="Journey status" hidden>
        <div class="health-cluster" aria-label="Health">
          <svg viewBox="0 0 64 64" aria-hidden="true">
            <path d="M32 55C18 45 7 36 7 22 7 11 20 6 32 17 44 6 57 11 57 22c0 14-11 23-25 33Z" />
          </svg>
          <div class="health-track"><i id="health-fill"></i></div>
        </div>

        <div id="route-track" class="wave-track route-track" aria-label="Journey progress">
          <i class="wave-pip route-pip" data-region="0"><span></span></i>
          <i class="wave-line"></i>
          <i class="wave-pip route-pip" data-region="1"><span></span></i>
          <i class="wave-line"></i>
          <i class="wave-pip route-pip" data-region="2"><span></span></i>
          <i class="wave-line"></i>
          <i class="wave-pip route-pip boss" data-region="3">
            <svg viewBox="0 0 40 40" aria-hidden="true">
              <path d="m6 13 8 7 6-12 6 12 8-7-3 19H9Z" />
            </svg>
          </i>
        </div>

        <div class="score-cluster" aria-label="Energy collected">
          <svg viewBox="0 0 48 48" aria-hidden="true"><path d="m24 3 8 13 13 8-13 8-8 13-8-13-13-8 13-8Z" /></svg>
          <strong id="energy-count">0</strong>
        </div>

        <div id="boss-health" class="boss-health" hidden aria-label="Boss health">
          <svg viewBox="0 0 40 40" aria-hidden="true"><path d="m6 13 8 7 6-12 6 12 8-7-3 19H9Z" /></svg>
          <div><i id="boss-health-fill"></i></div>
        </div>
      </section>

      <button id="map-button" class="utility-button map-button" type="button" aria-label="Open journey map" hidden>
        <svg viewBox="0 0 48 48" aria-hidden="true">
          <path d="m5 11 12-5 14 5 12-5v31l-12 5-14-5-12 5Zm12-5v31m14-26v31" />
        </svg>
      </button>

      <button id="sound-button" class="utility-button sound-button" type="button" aria-label="Turn sound off" aria-pressed="true" hidden>
        <svg class="sound-on" viewBox="0 0 48 48" aria-hidden="true">
          <path d="M7 19h8l10-9v28l-10-9H7Z" />
          <path d="M31 17c4 4 4 10 0 14M36 12c7 7 7 17 0 24" />
        </svg>
        <svg class="sound-off" viewBox="0 0 48 48" aria-hidden="true">
          <path d="M7 19h8l10-9v28l-10-9H7Z" />
          <path d="m32 18 11 12m0-12L32 30" />
        </svg>
      </button>

      <button id="pause-button" class="utility-button pause-button" type="button" aria-label="Pause battle" hidden>
        <svg viewBox="0 0 48 48" aria-hidden="true"><path d="M14 10h8v28h-8zm12 0h8v28h-8z" /></svg>
      </button>

      <div id="tutorial-focus" class="tutorial-focus" hidden aria-hidden="true">
        <i></i><i></i><i></i>
      </div>

      <div id="joystick-zone" class="joystick-zone" hidden aria-label="Movement control">
        <div id="joystick-base" class="joystick-base" aria-hidden="true">
          <svg viewBox="0 0 100 100"><path d="M50 9 40 22h20ZM91 50 78 40v20ZM50 91l10-13H40ZM9 50l13 10V40Z" /></svg>
          <div id="joystick-knob" class="joystick-knob"></div>
        </div>
      </div>

      <div id="action-cluster" class="action-cluster" hidden>
        <button id="companion-button" class="ability-button companion-button" type="button" aria-label="Unleash the Grape Gripe" disabled>
          <span class="cooldown-ring" aria-hidden="true"></span>
          <svg viewBox="0 0 64 64" aria-hidden="true">
            <path d="M32 10c-13 0-23 10-28 22 5 12 15 22 28 22s23-10 28-22C55 20 45 10 32 10Z" />
            <circle cx="32" cy="32" r="10" />
            <circle cx="35" cy="29" r="3" />
          </svg>
        </button>

        <button id="dash-button" class="ability-button dash-button" type="button" aria-label="Dash">
          <span class="cooldown-ring" aria-hidden="true"></span>
          <svg viewBox="0 0 64 64" aria-hidden="true">
            <path d="M10 42c11 0 18-5 25-15l5-7 14 2-7 12 8 5-15 5-6 10-8-4 4-9c-7 5-13 7-20 7Z" />
          </svg>
        </button>

        <button id="attack-button" class="attack-button" type="button" aria-label="Attack">
          <span class="attack-glow" aria-hidden="true"></span>
          <svg viewBox="0 0 84 84" aria-hidden="true">
            <path d="M22 58c-5-6-4-14 1-19l4-4V20c0-4 6-4 6 0v10-14c0-4 6-4 6 0v14-17c0-4 6-4 6 0v18-14c0-4 6-4 6 0v20l4-8c2-4 8-1 6 4l-7 17c-3 7-8 15-17 18-8 2-14-3-19-10Z" />
          </svg>
        </button>
      </div>

      <section id="upgrade-screen" class="upgrade-screen" hidden aria-label="Choose a power">
        <div class="upgrade-halo" aria-hidden="true"></div>
        <div class="upgrade-grid">
          <button class="upgrade-card power" type="button" data-upgrade="power" aria-label="Stronger attacks">
            <svg viewBox="0 0 84 84" aria-hidden="true">
              <path d="m42 5 8 20 21-7-11 18 18 11-22 3 2 22-16-15-16 15 2-22-22-3 18-11-11-18 21 7Z" />
            </svg>
            <span class="level-dots" aria-hidden="true"><i></i><i></i><i></i></span>
          </button>
          <button class="upgrade-card speed" type="button" data-upgrade="speed" aria-label="Faster movement and dashing">
            <svg viewBox="0 0 84 84" aria-hidden="true">
              <path d="M7 47c14 0 24-6 32-21l8-14 22 4-11 18 14 7-24 8-9 18-13-7 7-14c-10 7-18 10-26 10Z" />
            </svg>
            <span class="level-dots" aria-hidden="true"><i></i><i></i><i></i></span>
          </button>
          <button class="upgrade-card shield" type="button" data-upgrade="shield" aria-label="More health and protection">
            <svg viewBox="0 0 84 84" aria-hidden="true">
              <path d="M42 6 71 17v21c0 19-12 32-29 40C25 70 13 57 13 38V17Z" />
              <path d="m27 41 10 10 21-23" />
            </svg>
            <span class="level-dots" aria-hidden="true"><i></i><i></i><i></i></span>
          </button>
        </div>
      </section>

      <section id="pause-screen" class="pause-screen" hidden aria-label="Battle paused">
        <button id="resume-button" class="round-overlay-button" type="button" aria-label="Resume battle">
          <svg viewBox="0 0 100 100" aria-hidden="true"><path d="M38 25 76 50 38 75Z" /></svg>
        </button>
      </section>

      <section id="map-screen" class="map-screen" hidden aria-label="Journey map">
        <div class="map-vine" aria-hidden="true">
          <i class="map-line line-one"></i>
          <i class="map-line line-two"></i>
          <i class="map-line line-three"></i>
          <span class="map-node cellar" data-map-region="0"><b>1</b><em>Root Cellar</em></span>
          <span class="map-node vineway" data-map-region="1"><b>2</b><em>Vineway</em></span>
          <span class="map-node press" data-map-region="2"><b>3</b><em>Press Pit</em></span>
          <span class="map-node sourwood" data-map-region="3"><b>4</b><em>Sourwood</em></span>
        </div>
        <div class="map-legend" aria-hidden="true">
          <i></i><i></i><i></i>
        </div>
        <button id="close-map-button" class="round-overlay-button map-close-button" type="button" aria-label="Close journey map">
          <svg viewBox="0 0 100 100" aria-hidden="true"><path d="m29 29 42 42m0-42L29 71" /></svg>
        </button>
      </section>

      <section id="end-screen" class="end-screen" hidden aria-live="polite">
        <div id="end-emblem" class="end-emblem" aria-hidden="true">
          <svg class="crown-emblem" viewBox="0 0 120 120"><path d="m17 38 25 20 18-39 18 39 25-20-10 59H27Z" /></svg>
          <svg class="broken-emblem" viewBox="0 0 120 120"><path d="M60 9 93 29l15 36-20 35-40 11-33-25L12 47l27-31Z" /><path d="m62 12-13 34 18 10-21 50" /></svg>
        </div>
        <div class="final-score" aria-label="Final energy score">
          <svg viewBox="0 0 48 48" aria-hidden="true"><path d="m24 3 8 13 13 8-13 8-8 13-8-13-13-8 13-8Z" /></svg>
          <strong id="final-score">0</strong>
        </div>
        <button id="restart-button" class="round-overlay-button restart-button" type="button" aria-label="Battle again">
          <svg viewBox="0 0 100 100" aria-hidden="true">
            <path d="M79 30V11L68 22a35 35 0 1 0 8 48l-12-8a21 21 0 1 1-5-29L45 47h34Z" />
          </svg>
        </button>
      </section>

      <p id="live-status" class="sr-only" aria-live="polite"></p>
    </main>

    <noscript>This game needs JavaScript enabled.</noscript>
    <script src="./journey.js" defer></script>
  </body>
</html>
