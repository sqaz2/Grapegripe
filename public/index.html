<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#090611" />
    <meta
      name="description"
      content="Travel the living Gripevine, battle corrupted complaints, and unleash the Grape Gripe."
    />
    <title>Grape Gripe — Journey Through the Gripevine</title>
    <link rel="preload" href="./assets/root-cellar.webp" as="image" />
    <link rel="preload" href="./assets/grape-fighter.webp" as="image" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main id="game-shell" aria-label="Grape Gripe action journey">
      <canvas
        id="world"
        aria-label="A top-down journey through four vineyard regions. Move in eight directions with the left control. Attack, dash, and unleash the Grape Gripe with the buttons on the right."
      ></canvas>

      <div id="loading-screen" class="loading-screen" aria-live="polite">
        <div class="loading-seed" aria-hidden="true"><i></i><i></i><i></i></div>
        <p id="loading-message">Loading the vineyard…</p>
        <button id="retry-load" class="round-overlay-button" type="button" aria-label="Retry loading the vineyard" hidden>↻</button>
        <span class="sr-only">Growing the Gripevine</span>
      </div>

      <section id="start-screen" class="start-screen" hidden>
        <div class="brand-lockup" aria-hidden="true">
          <span>GRAPE</span><i></i><span>GRIPE</span>
        </div>
        <img
          class="start-fighter"
          src="./assets/grape-fighter.webp"
          alt=""
          width="606"
          height="620"
        />
        <div class="start-actions">
          <button id="start-button" class="start-button" type="button" aria-label="Begin the journey">
            <svg viewBox="0 0 100 100" aria-hidden="true"><path d="M38 25 76 50 38 75Z" /></svg>
            <span>NEW</span>
          </button>
          <button id="continue-button" class="continue-button" type="button" aria-label="Continue from the last safe checkpoint" hidden>
            <svg viewBox="0 0 100 100" aria-hidden="true"><path d="M22 48h42L49 33l10-10 32 27-32 27-10-10 15-15H22Zm-9-30h12v64H13Z" /></svg>
            <span>CONTINUE</span>
          </button>
        </div>
        <div class="start-waves" aria-hidden="true">
          <i></i><i></i><i></i><i class="boss-dot"></i>
        </div>
      </section>

      <section id="hud" class="hud" aria-label="Journey status" hidden>
        <div class="health-cluster" aria-label="Health">
          <svg viewBox="0 0 64 64" aria-hidden="true">
            <path d="M32 55C18 45 7 36 7 22 7 11 20 6 32 17 44 6 57 11 57 22c0 14-11 23-25 33Z" />
          </svg>
          <div class="health-track"><i id="health-fill"></i></div>
        </div>

        <div id="route-track" class="wave-track route-track" aria-label="Journey progress">
          <i class="wave-pip route-pip" data-region="0"><span></span></i>
          <i class="wave-line"></i>
          <i class="wave-pip route-pip" data-region="1"><span></span></i>
          <i class="wave-line"></i>
          <i class="wave-pip route-pip" data-region="2"><span></span></i>
          <i class="wave-line"></i>
          <i class="wave-pip route-pip boss" data-region="3">
            <svg viewBox="0 0 40 40" aria-hidden="true">
              <path d="m6 13 8 7 6-12 6 12 8-7-3 19H9Z" />
            </svg>
          </i>
        </div>

        <div class="score-cluster" aria-label="Energy collected">
          <svg viewBox="0 0 48 48" aria-hidden="true"><path d="m24 3 8 13 13 8-13 8-8 13-8-13-13-8 13-8Z" /></svg>
          <strong id="energy-count">0</strong>
        </div>

        <div id="boss-health" class="boss-health" hidden aria-label="Boss health">
          <svg viewBox="0 0 40 40" aria-hidden="true"><path d="m6 13 8 7 6-12 6 12 8-7-3 19H9Z" /></svg>
          <div><i id="boss-health-fill"></i></div>
        </div>

        <div id="objective-strip" class="objective-strip" aria-label="Mission objectives">
          <i data-objective-slot="0"></i><i data-objective-slot="1"></i><i data-objective-slot="2"></i><i data-objective-slot="3"></i>
        </div>
      </section>

      <button id="map-button" class="utility-button map-button" type="button" aria-label="Open journey map" hidden>
        <svg viewBox="0 0 48 48" aria-hidden="true">
          <path d="m5 11 12-5 14 5 12-5v31l-12 5-14-5-12 5Zm12-5v31m14-26v31" />
        </svg>
      </button>

      <button id="sound-button" class="utility-button sound-button" type="button" aria-label="Turn sound off" aria-pressed="true" hidden>
        <svg class="sound-on" viewBox="0 0 48 48" aria-hidden="true">
          <path d="M7 19h8l10-9v28l-10-9H7Z" />
          <path d="M31 17c4 4 4 10 0 14M36 12c7 7 7 17 0 24" />
        </svg>
        <svg class="sound-off" viewBox="0 0 48 48" aria-hidden="true">
          <path d="M7 19h8l10-9v28l-10-9H7Z" />
          <path d="m32 18 11 12m0-12L32 30" />
        </svg>
      </button>

      <button id="pause-button" class="utility-button pause-button" type="button" aria-label="Pause battle" hidden>
        <svg viewBox="0 0 48 48" aria-hidden="true"><path d="M14 10h8v28h-8zm12 0h8v28h-8z" /></svg>
      </button>

      <div id="tutorial-focus" class="tutorial-focus" hidden aria-hidden="true">
        <i></i><i></i><i></i>
      </div>

      <div id="joystick-zone" class="joystick-zone" hidden aria-label="Movement control">
        <div id="joystick-base" class="joystick-base" aria-hidden="true">
          <svg viewBox="0 0 100 100"><path d="M50 9 40 22h20ZM91 50 78 40v20ZM50 91l10-13H40ZM9 50l13 10V40Z" /></svg>
          <div id="joystick-knob" class="joystick-knob"></div>
        </div>
      </div>

      <div id="action-cluster" class="action-cluster" hidden>
        <button id="companion-button" class="ability-button companion-button" type="button" aria-label="Unleash the Grape Gripe" disabled>
          <span class="cooldown-ring" aria-hidden="true"></span>
          <svg viewBox="0 0 64 64" aria-hidden="true">
            <path d="M32 10c-13 0-23 10-28 22 5 12 15 22 28 22s23-10 28-22C55 20 45 10 32 10Z" />
            <circle cx="32" cy="32" r="10" />
            <circle cx="35" cy="29" r="3" />
          </svg>
        </button>

        <button id="dash-button" class="ability-button dash-button" type="button" aria-label="Dash">
          <span class="cooldown-ring" aria-hidden="true"></span>
          <svg viewBox="0 0 64 64" aria-hidden="true">
            <path d="M10 42c11 0 18-5 25-15l5-7 14 2-7 12 8 5-15 5-6 10-8-4 4-9c-7 5-13 7-20 7Z" />
          </svg>
        </button>

        <button id="attack-button" class="attack-button" type="button" aria-label="Attack">
          <span class="attack-glow" aria-hidden="true"></span>
          <svg class="attack-icon" viewBox="0 0 84 84" aria-hidden="true">
            <path d="M22 58c-5-6-4-14 1-19l4-4V20c0-4 6-4 6 0v10-14c0-4 6-4 6 0v14-17c0-4 6-4 6 0v18-14c0-4 6-4 6 0v20l4-8c2-4 8-1 6 4l-7 17c-3 7-8 15-17 18-8 2-14-3-19-10Z" />
          </svg>
          <svg class="interact-icon" viewBox="0 0 84 84" aria-hidden="true">
            <path d="M42 7c7 0 12 6 12 13v14h8c9 0 15 8 13 17l-3 13c-2 8-9 13-17 13H34c-6 0-11-3-14-8L8 48c-3-5 4-10 8-6l10 10V20c0-7 5-13 12-13Zm0 8c-3 0-5 2-5 5v30l-6 5 7 13h17c4 0 8-3 9-7l3-13c1-3-2-6-5-6H46V20c0-3-2-5-4-5Z" />
          </svg>
          <svg class="grapple-icon" viewBox="0 0 84 84" aria-hidden="true">
            <path d="M17 70c18-2 30-11 34-26 3-12 1-25 10-31 6-4 13 0 12 7-1 8-10 10-16 6-7-5-15 0-16 10-2 14 8 23 22 24" />
            <path d="m57 49 8 11-13 5" />
          </svg>
        </button>
      </div>

      <section id="upgrade-screen" class="upgrade-screen" hidden aria-label="Choose a power">
        <div class="upgrade-halo" aria-hidden="true"></div>
        <div class="upgrade-grid">
          <button class="upgrade-card power" type="button" data-upgrade="power" aria-label="Stronger attacks">
            <svg viewBox="0 0 84 84" aria-hidden="true">
              <path d="m42 5 8 20 21-7-11 18 18 11-22 3 2 22-16-15-16 15 2-22-22-3 18-11-11-18 21 7Z" />
            </svg>
            <span class="level-dots" aria-hidden="true"><i></i><i></i><i></i></span>
          </button>
          <button class="upgrade-card speed" type="button" data-upgrade="speed" aria-label="Faster movement and dashing">
            <svg viewBox="0 0 84 84" aria-hidden="true">
              <path d="M7 47c14 0 24-6 32-21l8-14 22 4-11 18 14 7-24 8-9 18-13-7 7-14c-10 7-18 10-26 10Z" />
            </svg>
            <span class="level-dots" aria-hidden="true"><i></i><i></i><i></i></span>
          </button>
          <button class="upgrade-card shield" type="button" data-upgrade="shield" aria-label="More health and protection">
            <svg viewBox="0 0 84 84" aria-hidden="true">
              <path d="M42 6 71 17v21c0 19-12 32-29 40C25 70 13 57 13 38V17Z" />
              <path d="m27 41 10 10 21-23" />
            </svg>
            <span class="level-dots" aria-hidden="true"><i></i><i></i><i></i></span>
          </button>
        </div>
      </section>

      <section id="verdict-screen" class="verdict-screen" hidden role="dialog" aria-modal="true" aria-label="Choose what to do with the gripe">
        <div class="verdict-orbit" aria-hidden="true">
          <i class="verdict-clue eye"></i><i class="verdict-clue page"></i><i class="verdict-clue heart"></i>
        </div>
        <div class="verdict-prompt" aria-hidden="true">
          <span class="verdict-grape"><i></i><i></i><i></i><b></b></span>
          <strong>?</strong>
        </div>
        <div class="verdict-grid">
          <button class="verdict-card say" type="button" data-verdict="say" aria-label="Say it: start each area with the Grape Gripe ready">
            <svg viewBox="0 0 84 84" aria-hidden="true"><path d="M10 35v14h13l28 17V18L23 35Zm50-8c8 8 8 22 0 30m9-39c14 14 14 34 0 48" /></svg>
            <span>SAY</span><i class="perk-mark">⚡</i>
          </button>
          <button class="verdict-card solve" type="button" data-verdict="solve" aria-label="Solve it: fire a heavy grape every second attack">
            <svg viewBox="0 0 84 84" aria-hidden="true"><path d="M51 9a18 18 0 0 0-19 24L9 56l19 19 23-23A18 18 0 0 0 75 33L62 46l-10-3-3-10 13-13A18 18 0 0 0 51 9Z" /></svg>
            <span>SOLVE</span><i class="perk-mark">×2</i>
          </button>
          <button class="verdict-card save" type="button" data-verdict="save" aria-label="Save it: your companion blocks the first hit in each area">
            <svg viewBox="0 0 84 84" aria-hidden="true"><path d="M42 7 70 18v20c0 18-11 30-28 39C25 68 14 56 14 38V18Z" /><path d="M42 57S23 46 23 33c0-10 13-13 19-4 6-9 19-6 19 4 0 13-19 24-19 24Z" /></svg>
            <span>SAVE</span><i class="perk-mark">1×</i>
          </button>
          <button class="verdict-card drop" type="button" data-verdict="drop" aria-label="Drop it: dash recharges faster">
            <svg viewBox="0 0 84 84" aria-hidden="true"><path d="M42 7v48m-17-16 17 17 17-17M18 68h48" /></svg>
            <span>DROP</span><i class="perk-mark">≫</i>
          </button>
        </div>
      </section>

      <section id="pause-screen" class="pause-screen" hidden role="dialog" aria-modal="true" aria-label="Battle paused">
        <div class="pause-panel">
          <button id="resume-button" class="round-overlay-button" type="button" aria-label="Resume battle">
            <svg viewBox="0 0 100 100" aria-hidden="true"><path d="M38 25 76 50 38 75Z" /></svg>
          </button>
          <button id="gameplay-help-toggle" class="help-toggle" type="button" role="switch" aria-checked="true" aria-label="Gameplay help on">
            <span class="help-orb" aria-hidden="true">?</span>
            <strong>HELP</strong>
            <i aria-hidden="true"><span></span></i>
            <em id="gameplay-help-state">ON</em>
          </button>
        </div>
      </section>

      <section id="context-help" class="context-help" hidden role="dialog" aria-modal="true" aria-labelledby="context-help-title" aria-describedby="context-help-copy">
        <div id="context-help-card" class="context-help-card">
          <div class="context-help-visual cork-help" aria-hidden="true">
            <span class="lesson-cork"><i></i></span>
            <b>➜</b>
            <span class="lesson-socket"><i></i></span>
          </div>
          <div class="context-help-visual sideview-help" aria-hidden="true">
            <span class="lesson-control lesson-jump"><i>↑</i></span>
            <span class="lesson-plus">+</span>
            <span class="lesson-control lesson-grapple"><i></i><b>☝</b></span>
            <span class="lesson-plus">+</span>
            <span class="lesson-control lesson-dash">➜</span>
          </div>
          <div class="context-help-visual mystery-help" aria-hidden="true">
            <span class="lesson-clue eye"></span><span class="lesson-plus">+</span>
            <span class="lesson-clue page"></span><span class="lesson-plus">+</span>
            <span class="lesson-clue heart"></span><b>➜</b><span class="lesson-choice">?</span>
          </div>
          <h2 id="context-help-title">Cork secured</h2>
          <p id="context-help-copy">Carry it to the glowing socket. You can still fire.</p>
          <button id="context-help-continue" class="context-help-continue" type="button" aria-label="Continue playing">
            <svg viewBox="0 0 100 100" aria-hidden="true"><path d="M38 25 76 50 38 75Z" /></svg>
          </button>
        </div>
      </section>

      <section id="map-screen" class="map-screen" hidden aria-label="Journey map">
        <div class="map-vine">
          <i class="map-line line-one" aria-hidden="true"></i>
          <i class="map-line line-two" aria-hidden="true"></i>
          <i class="map-line line-three" aria-hidden="true"></i>
          <button type="button" class="map-node cellar" data-map-region="0" aria-label="Root Cellar"><b>1</b><em>Root Cellar</em></button>
          <button type="button" class="map-node vineway" data-map-region="1" aria-label="Vineway"><b>2</b><em>Vineway</em></button>
          <button type="button" class="map-node press" data-map-region="2" aria-label="Press Pit"><b>3</b><em>Press Pit</em></button>
          <button type="button" class="map-node sourwood" data-map-region="3" aria-label="Sourwood"><b>4</b><em>Sourwood</em></button>
          <span id="side-route-node" class="side-route-node" aria-label="Hidden Vineway passage"><b>↔</b></span>
        </div>
        <div id="map-stamps" class="map-stamps" aria-label="Discoveries">
          <i title="Root shortcut">⌁</i><i title="Vineway passage">↔</i><i title="Working press">◉</i><i title="Restored world">✦</i>
        </div>
        <button id="guide-button" class="guide-button" type="button" aria-label="Open the visual strategy guide">
          <svg viewBox="0 0 64 64" aria-hidden="true"><path d="M8 10h20c5 0 9 4 9 9v35c-3-4-7-6-12-6H8Zm48 0H44c-5 0-9 4-9 9v35c3-4 7-6 12-6h9Z" /><path d="M16 22h12M16 31h12m8-9h12m-12 9h12" /></svg>
        </button>
        <div class="map-legend" aria-hidden="true">
          <i></i><i></i><i></i>
        </div>
        <button id="close-map-button" class="round-overlay-button map-close-button" type="button" aria-label="Close journey map">
          <svg viewBox="0 0 100 100" aria-hidden="true"><path d="m29 29 42 42m0-42L29 71" /></svg>
        </button>
      </section>

      <section id="field-guide-screen" class="field-guide-screen" hidden aria-label="Visual strategy guide">
        <div id="guide-grid" class="guide-grid">
          <article data-guide="sourling" aria-label="Dodge a Sourling's charge, then strike">
            <img src="./assets/sourling.webp" alt="" /><span class="danger-line"></span><b>↗</b><i>✹</i>
          </article>
          <article data-guide="moth" aria-label="Circle a Rumor Moth's projectiles">
            <img src="./assets/rumor-moth.webp" alt="" /><span class="orb">●</span><b>↺</b><i>✹</i>
          </article>
          <article data-guide="brute" aria-label="Let a Thorn Brute miss, then use a heavy third strike">
            <img src="./assets/thorn-brute.webp" alt="" /><span class="danger-ring"></span><b>•••</b><i>✹</i>
          </article>
          <article data-guide="boss" aria-label="Power both vents and unleash the Grape Gripe on the Maw">
            <img src="./assets/gripe-maw.webp" alt="" /><span class="twin-vents">◉ ◉</span><b>➜</b><i>◉</i>
          </article>
        </div>
        <button id="close-guide-button" class="round-overlay-button map-close-button" type="button" aria-label="Close the visual strategy guide">
          <svg viewBox="0 0 100 100" aria-hidden="true"><path d="m29 29 42 42m0-42L29 71" /></svg>
        </button>
      </section>

      <section id="end-screen" class="end-screen" hidden aria-live="polite">
        <div id="end-emblem" class="end-emblem" aria-hidden="true">
          <svg class="crown-emblem" viewBox="0 0 120 120"><path d="m17 38 25 20 18-39 18 39 25-20-10 59H27Z" /></svg>
          <svg class="broken-emblem" viewBox="0 0 120 120"><path d="M60 9 93 29l15 36-20 35-40 11-33-25L12 47l27-31Z" /><path d="m62 12-13 34 18 10-21 50" /></svg>
        </div>
        <div class="final-score" aria-label="Final energy score">
          <svg viewBox="0 0 48 48" aria-hidden="true"><path d="m24 3 8 13 13 8-13 8-8 13-8-13-13-8 13-8Z" /></svg>
          <strong id="final-score">0</strong>
        </div>
        <p id="ending-mark" class="ending-mark">THE VINEYARD BREATHES AGAIN</p>
        <button id="restart-button" class="round-overlay-button restart-button" type="button" aria-label="Battle again">
          <svg viewBox="0 0 100 100" aria-hidden="true">
            <path d="M79 30V11L68 22a35 35 0 1 0 8 48l-12-8a21 21 0 1 1-5-29L45 47h34Z" />
          </svg>
        </button>
      </section>

      <p id="live-status" class="sr-only" aria-live="polite"></p>
    </main>

    <noscript>This game needs JavaScript enabled.</noscript>
    <script type="module" src="./journey.js"></script>
  </body>
</html>
